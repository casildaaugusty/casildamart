<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart - CasildaMart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        .cart-container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        .cart-item {
            border: 1px solid #ddd;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
        }

        .cart-item p {
            font-size: 18px;
            margin: 10px 0;
        }

        .back-button {
            display: inline-block;
            margin-top: 20px;
            margin-right: 10px;
            padding: 10px 18px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .back-button:hover {
            background-color: #555;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="cart-container">

    <h1>Your Cart</h1>

    <div class="cart-item">

        <p>
            <strong>Product ID:</strong>
            <span id="productId">3</span>
        </p>

        <p>
            <strong>Product Name:</strong>
            <span id="productName">Product</span>
        </p>

        <p>
            <strong>Price:</strong>
            ₹<span id="price">0</span>
        </p>

        <p>
            <strong>Quantity:</strong>
            <span id="quantity">1</span>
        </p>

        <p class="total">
            <strong>Total Amount:</strong>
            ₹<span id="total">0</span>
        </p>

    </div>

    <a href="/products" class="back-button">
        Back to Products
    </a>

    <a id="orderButton" href="/order" class="back-button">
        Place Order
    </a>

</div>

<script>

    const params = new URLSearchParams(window.location.search);

    const productId = params.get("productId");
    const productName = params.get("productName");
    const quantity = params.get("quantity");
    const price = params.get("price");
    const username = params.get("username");

    if (productId) {
        document.getElementById("productId").textContent = productId;
    }

    if (productName) {
        document.getElementById("productName").textContent = productName;
    }

    if (quantity) {
        document.getElementById("quantity").textContent = quantity;
    }

    if (price) {
        document.getElementById("price").textContent = price;
    }

    const actualQuantity = Number(quantity || 1);
    const actualPrice = Number(price || 0);

    const total = actualPrice * actualQuantity;

    document.getElementById("total").textContent =
        total.toFixed(2);

    const orderButton = document.getElementById("orderButton");

    orderButton.href =
        "/order?username=" + encodeURIComponent(username || "") +
        "&productId=" + (productId || "3") +
        "&productName=" + encodeURIComponent(productName || "Product") +
        "&quantity=" + actualQuantity +
        "&price=" + actualPrice +
        "&total=" + total;

</script>

</body>
</html>
