<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>CasildaMart - Products</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5fff5;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #2e7d32;
        }

        .search-box {
            text-align: center;
            margin: 20px 0 30px;
        }

        .search-box input {
            width: 280px;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        .search-box button {
            padding: 10px 18px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .product-card h2 {
            color: #2e7d32;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
        }

        .seller {
            color: #666;
        }

        .quantity {
            width: 60px;
            padding: 8px;
            margin: 10px;
        }

        .cart-button {
            padding: 10px 15px;
            background-color: #388e3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .cart-button:hover {
            background-color: #1b5e20;
        }

        .review-button {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #f9a825;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .review-button:hover {
            background-color: #f57f17;
        }

        .view-cart {
            display: block;
            width: fit-content;
            margin: 30px auto;
            padding: 12px 20px;
            background-color: #2e7d32;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .view-cart:hover {
            background-color: #1b5e20;
        }
    </style>
</head>

<body>

<h1>CasildaMart Products</h1>


<!-- Search -->

<div class="search-box">

    <form action="/products" method="get">

        <input type="text"
               name="search"
               th:value="${search}"
               placeholder="Search products...">

        <button type="submit">
            🔍 Search
        </button>

    </form>

</div>


<!-- Products -->

<div class="products">

    <div class="product-card"
         th:each="product : ${products}">

        <!-- Product Name -->

        <h2 th:text="${product.name}">
            Product Name
        </h2>


        <!-- Price -->

        <p class="price">

            ₹<span th:text="${product.price}">
                0
            </span>

        </p>


        <!-- Seller -->

        <p class="seller">

            Seller:

            <span th:text="${product.seller}">
                Seller
            </span>

        </p>


        <!-- Add to Cart -->

        <form action="/cart/add"
              method="post">

            <input type="hidden"
                   name="productId"
                   th:value="${product.id}">

            <input type="hidden"
                   name="price"
                   th:value="${product.price}">

            <input type="hidden"
                   name="username"
                   value="YOUR_USERNAME">


            <label>
                Quantity:
            </label>


            <input type="number"
                   name="quantity"
                   value="1"
                   min="1"
                   class="quantity">


            <br>


            <button type="submit"
                    class="cart-button">

                🛒 Add to Cart

            </button>

        </form>


        <!-- Review Button -->

        <a th:href="@{/reviews(productId=${product.id})}"
           class="review-button">

            ⭐ Review

        </a>

    </div>

</div>


<!-- View Cart -->

<a href="/cart?username=YOUR_USERNAME"
   class="view-cart">

    🛒 View Cart

</a>


</body>

</html>
