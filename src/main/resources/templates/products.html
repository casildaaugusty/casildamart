<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CasildaMart - Products</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5fff5;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #2e7d32;
        }

        .search-box {
            text-align: center;
            margin: 20px 0;
        }

        .search-box input {
            width: 300px;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        .search-box button {
            padding: 10px 18px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .search-box button:hover {
            background-color: #1b5e20;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .product-card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            text-align: center;
        }

        .product-card h2 {
            color: #2e7d32;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
        }

        .seller {
            color: #666;
        }
    </style>
</head>

<body>

<h1>CasildaMart Products</h1>

<div class="search-box">
    <form action="/products" method="get">

        <input type="text"
               name="search"
               th:value="${search}"
               placeholder="Search products...">

        <button type="submit">🔍 Search</button>

    </form>
</div>

<div class="products">

    <div class="product-card" th:each="product : ${products}">

        <h2 th:text="${product.name}">Product Name</h2>

        <p class="price">
            ₹<span th:text="${product.price}">0</span>
        </p>

        <p class="seller">
            Seller:
            <span th:text="${product.seller}">Seller</span>
        </p>

    </div>

</div>

</body>
</html>
