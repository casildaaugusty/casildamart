<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews - CASILDAMART</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        h2 {
            color: #444;
            margin-top: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .submit-button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #28a745;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-button:hover {
            background-color: #218838;
        }

        .review {
            margin-top: 15px;
            padding: 15px;
            background-color: #f8f8f8;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .customer {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .rating {
            margin-bottom: 8px;
            font-size: 18px;
        }

        .comment {
            color: #555;
            line-height: 1.5;
        }

        .no-reviews {
            text-align: center;
            color: #777;
        }

        .back-button {
            display: block;
            margin-top: 25px;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
        }

        .back-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>⭐ Product Reviews</h1>

    <h2>Write a Review</h2>

    <form action="/submit-review" method="post">

        <!-- Product ID -->
        <input type="hidden"
               name="productId"
               th:value="${productId}">

        <!-- Customer Username -->
        <label for="username">Customer Username</label>

        <input type="text"
               id="username"
               name="username"
               th:value="${username}"
               placeholder="Enter your username"
               required>

        <!-- Rating -->
        <label for="rating">Rating</label>

        <select id="rating" name="rating" required>
            <option value="">Select Rating</option>
            <option value="5">⭐⭐⭐⭐⭐</option>
            <option value="4">⭐⭐⭐⭐</option>
            <option value="3">⭐⭐⭐</option>
            <option value="2">⭐⭐</option>
            <option value="1">⭐</option>
        </select>

        <!-- Comment -->
        <label for="comment">Comment</label>

        <textarea id="comment"
                  name="comment"
                  placeholder="Write your review..."
                  required></textarea>

        <button type="submit" class="submit-button">
            Submit Review
        </button>

    </form>

    <h2>Customer Reviews</h2>

    <!-- Display Reviews -->
    <div class="review"
         th:each="review : ${reviews}">

        <div class="customer">
            👤 Customer:
            <span th:text="${review.username}">
                Customer Username
            </span>
        </div>

        <div class="rating">
            <span th:if="${review.rating == 5}">⭐⭐⭐⭐⭐</span>
            <span th:if="${review.rating == 4}">⭐⭐⭐⭐</span>
            <span th:if="${review.rating == 3}">⭐⭐⭐</span>
            <span th:if="${review.rating == 2}">⭐⭐</span>
            <span th:if="${review.rating == 1}">⭐</span>
        </div>

        <div class="comment"
             th:text="${review.comment}">
            Review comment
        </div>

    </div>

    <!-- No Reviews -->
    <p class="no-reviews"
       th:if="${#lists.isEmpty(reviews)}">
        No reviews yet. Be the first to review this product!
    </p>

    <a href="/products" class="back-button">
        ← Back to Products
    </a>

</div>

</body>
</html>
